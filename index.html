<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>كارة ستور | تحميل التطبيق</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24113d 0,#0b0912 42%,#05060a 100%);color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,100%);background:rgba(15,16,26,.92);border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:32px 22px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.logo{width:92px;height:92px;border-radius:24px;object-fit:cover;background:#171323;margin:0 auto 18px;display:block}
h1{margin:0 0 8px;font-size:30px}
p{color:#aeb4c4;line-height:1.8;margin:8px 0 24px}
.btn{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899);padding:17px;border-radius:16px;font-size:19px;font-weight:700;box-shadow:0 12px 35px rgba(124,58,237,.28)}
.info{margin-top:18px;color:#777f91;font-size:13px}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#171a26;color:#c8cddd;margin-bottom:18px;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="badge">Android • APK</div>
  <div class="logo" aria-hidden="true"></div>
  <h1>كارة ستور</h1>
  <p>حمّل تطبيق كارة ستور على جهاز Android واستمتع بالوصول السريع إلى خدمات المتجر.</p>
  <a class="btn" href="Kara-Store.apk" download>⬇️ تحميل التطبيق</a>
  <div class="info">اسم الملف: Kara-Store.apk</div>
</main>
</body>
</html>
